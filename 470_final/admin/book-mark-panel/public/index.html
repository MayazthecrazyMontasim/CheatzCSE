<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bookmark Admin Panel</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">

    <h1>📚 Bookmark Admin Panel</h1>

    <div class="stats">
      <h2>Total Users: <span id="totalUsers">0</span></h2>
    </div>

    <table>
      <thead>
        <tr>
          <th>User ID</th>
          <th>Email</th>
          <th>Bookmarks Count</th>
          <th>Bookmarks</th>
        </tr>
      </thead>

      <tbody id="tableBody">
      </tbody>
    </table>

  </div>

  <script src="script.js"></script>
</body>
</html>
