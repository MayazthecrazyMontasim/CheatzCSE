<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shop Admin Panel</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">

    <h1>🛒 Shop Admin Panel</h1>

    <div class="top-bar">
      <div class="card">
        <h2>Total Orders</h2>
        <p id="totalOrders">0</p>
      </div>
    </div>

    <table>

      <thead>
        <tr>
          <th>Order ID</th>
          <th>Customer</th>
          <th>Email</th>
          <th>Amount</th>
          <th>Status</th>
          <th>Payment</th>
          <th>Items</th>
        </tr>
      </thead>

      <tbody id="ordersTable">
      </tbody>

    </table>

  </div>

  <script src="script.js"></script>
</body>
</html>
